<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--tpt-cream); padding: 30px; margin: 0; font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 1rem 2rem; border-radius: 9999px;
    background: #C97B27; color: #FBF8F1;
    font-weight: 400; font-size: 14px; letter-spacing: 0.1em;
    border: none; cursor: pointer;
    transition: background 0.15s cubic-bezier(0.4,0,0.2,1);
  }
  .btn-primary:hover { background: #1F3F2E; }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 1rem 2rem; border-radius: 9999px;
    background: transparent; color: #1F3F2E;
    font-weight: 400; font-size: 14px; letter-spacing: 0.1em;
    border: 1px solid #1F3F2E; cursor: pointer;
    transition: background 0.15s cubic-bezier(0.4,0,0.2,1), color 0.15s cubic-bezier(0.4,0,0.2,1);
  }
  .btn-secondary:hover { background: #1F3F2E; color: #FBF8F1; }
  .btn-hover {
    display: inline-flex; align-items: center; padding: 1rem 2rem; border-radius: 9999px;
    background: #1F3F2E; color: #FBF8F1; font-weight: 400; font-size: 14px; letter-spacing: 0.1em; border: 0;
  }
  .meta { font-size: 11px; color: #5C5A53; letter-spacing: 0.05em; margin-top: 14px; }
  .inline-cta { color: #1F3F2E; font-weight: 600; border-bottom: 2px solid #C97B27; padding-bottom: 2px; text-decoration: none; font-size: 14px; }
</style></head><body>
<div class="row">
  <button class="btn-primary">JOIN THE WAITLIST</button>
  <button class="btn-secondary">LEARN MORE</button>
  <span class="btn-hover">JOIN THE WAITLIST</span>
  <a href="#" class="inline-cta">Get the checklist →</a>
</div>
<div class="meta">Pill-shape · ls 0.1em · radius 9999px · resting → hover swap, no scale or shadow.</div>
</body></html>
