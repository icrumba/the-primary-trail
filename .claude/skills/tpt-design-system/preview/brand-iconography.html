<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--tpt-cream); font-family: var(--font-sans); }
  .meta { font-size: 11px; color: #5C5A53; line-height: 1.6; }
  .meta strong { color: #1F1F1F; font-weight: 600; }
  .row { display: flex; gap: 18px; align-items: center; padding: 8px 0; }
  .num { font-family: 'Lora', serif; font-size: 32px; font-weight: 600; color: #C97B27; line-height: 1; width: 60px; }
  .arrow { font-size: 18px; color: #1F3F2E; width: 60px; }
  .none { font-style: italic; color: #5C5A53; width: 60px; font-family: 'Lora', serif; }
</style></head><body>
<div class="row"><div class="num">01</div><div class="meta"><strong>Numerals as sequence.</strong> Lora 600, amber. The brand's only "icon".</div></div>
<div class="row"><div class="arrow">→</div><div class="meta"><strong>U+2192 right arrow.</strong> The only ornamental glyph — used at the end of inline link CTAs.</div></div>
<div class="row"><div class="none">none</div><div class="meta"><strong>No icons elsewhere.</strong> No emoji, no Lucide, no unicode bullets. Stay editorial.</div></div>
</body></html>
