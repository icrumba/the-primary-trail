<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .stripe { padding: 22px 28px; }
  .a { background: #F5EFE3; }
  .b { background: #EFE7D5; }
