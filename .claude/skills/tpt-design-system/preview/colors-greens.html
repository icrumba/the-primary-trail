<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--tpt-cream); padding: 28px; margin: 0; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 6px; padding: 16px 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-sans); border: 1px solid var(--tpt-line); }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 12px; font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .label { font-size: 10.5px; opacity: 0.7; margin-top: 6px; line-height: 1.35; }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#1F3F2E;color:#FBF8F1;">
    <div><div class="name">Forest</div><div class="label">Primary brand. Headings.</div></div>
    <div class="hex">#1F3F2E</div>
  </div>
  <div class="swatch" style="background:#142B1F;color:#FBF8F1;">
    <div><div class="name">Forest Dark</div><div class="label">Footer ground, depth.</div></div>
    <div class="hex">#142B1F</div>
  </div>
  <div class="swatch" style="background:#2C5440;color:#FBF8F1;">
    <div><div class="name">Forest Soft</div><div class="label">Hover / secondary.</div></div>
    <div class="hex">#2C5440</div>
  </div>
  <div class="swatch" style="background:#0F2027;color:#FBF8F1;">
    <div><div class="name">Navy</div><div class="label">Closing CTA band only.</div></div>
    <div class="hex">#0F2027</div>
  </div>
</div>
</body></html>
