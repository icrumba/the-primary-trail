<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--tpt-cream); font-family: var(--font-sans); }
  .row { display: flex; gap: 28px; align-items: center; }
  .card { width: 200px; height: 110px; background: #FBF8F1; border: 1px solid #DCD3BE; border-radius: 8px; padding: 16px; box-sizing: border-box; }
  .card.lift { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31, 63, 46, 0.08); }
  .card .t { font-family: 'Lora', serif; color: #1F3F2E; font-size: 14px; font-weight: 600; }
  .card .b { font-size: 11.5px; color: #5C5A53; margin-top: 4px; }
  .meta { font-size: 11px; color: #5C5A53; text-align: center; margin-top: 10px; }
</style></head><body>
<div class="row">
  <div>
    <div class="card"><div class="t">Resting</div><div class="b">Hairline only.</div></div>
    <div class="meta">No shadow at rest.</div>
  </div>
  <div>
    <div class="card lift"><div class="t">Hover</div><div class="b">−2px lift, soft shadow.</div></div>
    <div class="meta">0 8px 24px rgba(31,63,46,.08) · 0.2s</div>
  </div>
</div>
</body></html>
