<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--tpt-cream); padding: 28px; margin: 0; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 6px; padding: 14px 12px; min-height: 100px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-sans); border: 1px solid var(--tpt-line); color: #1F1F1F; }
  .name { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .hex { font-size: 11.5px; font-weight: 500; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .label { font-size: 10px; opacity: 0.65; margin-top: 4px; line-height: 1.35; }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#FBF8F1;"><div><div class="name">Warm White</div><div class="label">Card surfaces, inputs.</div></div><div class="hex">#FBF8F1</div></div>
  <div class="swatch" style="background:#F5EFE3;"><div><div class="name">Cream</div><div class="label">Default page bg.</div></div><div class="hex">#F5EFE3</div></div>
  <div class="swatch" style="background:#EFE7D5;"><div><div class="name">Cream Warm</div><div class="label">Alt section bg — rhythm.</div></div><div class="hex">#EFE7D5</div></div>
  <div class="swatch" style="background:#ECE4D2;"><div><div class="name">Cream Deep</div><div class="label">Status pills.</div></div><div class="hex">#ECE4D2</div></div>
  <div class="swatch" style="background:#DCD3BE;"><div><div class="name">Line</div><div class="label">Hairlines, borders.</div></div><div class="hex">#DCD3BE</div></div>
</div>
</body></html>
