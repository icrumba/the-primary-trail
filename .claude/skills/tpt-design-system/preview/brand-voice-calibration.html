<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--tpt-cream); font-family: var(--font-sans); }
  .pair { display: flex; gap: 14px; padding: 12px 0; align-items: flex-start; border-bottom: 1px solid #DCD3BE; }
  .pair:last-child { border: 0; }
  .tag { width: 60px; flex-shrink: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; padding: 3px 7px; border-radius: 3px; text-align: center; height: max-content; }
  .ok { background: #1F3F2E; color: #FBF8F1; }
  .no { background: #ECE4D2; color: #5C5A53; }
  .text { font-family: 'Lora', serif; font-size: 14px; line-height: 1.45; color: #1F3F2E; }
  .text.muted { color: #5C5A53; font-style: italic; font-size: 13px; }
</style></head><body>
<div class="pair"><div class="tag no">WRONG</div><div class="text muted">"Time to lawyer up and crush this."</div></div>
<div class="pair"><div class="tag no">WRONG</div><div class="text muted">"Dads have rights too — fight for yours."</div></div>
<div class="pair"><div class="tag ok">RIGHT</div><div class="text">"You're going to be okay. Not today. But you will be. Right now we focus on three things: stop the bleeding, get organized, and get a plan."</div></div>
</body></html>
