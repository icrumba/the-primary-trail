<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--tpt-cream); padding: 32px; margin: 0; font-family: var(--font-sans); }
  .row { display: flex; gap: 22px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--tpt-line); }
  .row:last-child { border: 0; }
  .sample { width: 240px; flex-shrink: 0; }
  .meta { font-size: 11px; color: var(--tpt-warm-gray); letter-spacing: 0.05em; flex: 1; }
  .meta strong { color: var(--tpt-charcoal); font-weight: 600; }
</style></head><body>
<div class="row">
  <div class="sample" style="font-family:'Lora',serif;font-weight:300;font-size:42px;letter-spacing:-0.02em;line-height:1.05;color:#1F3F2E;">A clear path through.</div>
  <div class="meta"><strong>H1 — Lora 300</strong><br>clamp(2.25rem, 6vw, 5.5rem) · ls -0.02em</div>
</div>
<div class="row">
  <div class="sample" style="font-family:'Lora',serif;font-weight:400;font-size:30px;letter-spacing:-0.01em;line-height:1.1;color:#1F3F2E;">The four pillars.</div>
  <div class="meta"><strong>H2 — Lora 400</strong><br>clamp(1.6rem, 3.5vw, 2.3rem) · ls -0.01em</div>
</div>
<div class="row">
  <div class="sample" style="font-family:'Lora',serif;font-weight:600;font-size:20px;color:#1F3F2E;">Get it all in one place</div>
  <div class="meta"><strong>H3 — Lora 600</strong><br>1.25rem · 20px</div>
</div>
<div class="row">
  <div class="sample" style="font-family:'Lora',serif;font-style:italic;font-weight:400;font-size:24px;color:#C97B27;">Capture, Organize, Reflect.</div>
  <div class="meta"><strong>H2 italic accent</strong><br>amber · used inside H2 spans only</div>
</div>
</body></html>
