<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--tpt-cream); font-family: var(--font-sans); }
  .scale { display: flex; align-items: flex-end; gap: 16px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: #1F3F2E; border-radius: 4px; }
  .name { font-size: 10px; color: #5C5A53; letter-spacing: 0.06em; }
  .val { font-size: 10.5px; color: #1F1F1F; font-variant-numeric: tabular-nums; font-weight: 500; }
</style></head><body>
<div class="scale">
  <div class="step"><div class="box" style="width:4px;height:4px;"></div><div class="name">space-1</div><div class="val">4px</div></div>
  <div class="step"><div class="box" style="width:8px;height:8px;"></div><div class="name">space-2</div><div class="val">8px</div></div>
  <div class="step"><div class="box" style="width:12px;height:12px;"></div><div class="name">space-3</div><div class="val">12px</div></div>
  <div class="step"><div class="box" style="width:16px;height:16px;"></div><div class="name">space-4</div><div class="val">16px</div></div>
  <div class="step"><div class="box" style="width:24px;height:24px;"></div><div class="name">space-5</div><div class="val">24px</div></div>
  <div class="step"><div class="box" style="width:32px;height:32px;"></div><div class="name">space-6</div><div class="val">32px</div></div>
  <div class="step"><div class="box" style="width:40px;height:40px;"></div><div class="name">space-7</div><div class="val">40px</div></div>
  <div class="step"><div class="box" style="width:48px;height:48px;"></div><div class="name">space-8</div><div class="val">48px</div></div>
  <div class="step"><div class="box" style="width:64px;height:64px;"></div><div class="name">space-9</div><div class="val">64px</div></div>
  <div class="step"><div class="box" style="width:80px;height:80px;"></div><div class="name">space-10</div><div class="val">80px</div></div>
</div>
</body></html>
