<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--tpt-cream); padding: 28px; margin: 0; }
  .wrap { display: flex; gap: 14px; }
  .swatch { flex: 1; border-radius: 6px; padding: 16px 14px; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-sans); border: 1px solid var(--tpt-line); }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .hex { font-size: 12px; font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .label { font-size: 10.5px; opacity: 0.75; margin-top: 6px; line-height: 1.4; }
  .rule { font-family: "Lora", serif; font-style: italic; font-size: 12px; margin-top: 18px; color: var(--tpt-warm-gray); text-align: center; }
</style></head><body>
<div class="wrap">
  <div class="swatch" style="background:#C97B27;color:#FBF8F1;">
    <div><div class="name">Amber</div><div class="label">Primary CTA fill, italic accent in H2s, Execute pillar, sequence numbers.</div></div>
    <div class="hex">#C97B27</div>
  </div>
  <div class="swatch" style="background:#E5A35E;color:#142B1F;">
    <div><div class="name">Amber Light</div><div class="label">Footer accent text on dark only.</div></div>
    <div class="hex">#E5A35E</div>
  </div>
</div>
<div class="rule">Highlight only — never paint full sections amber, never on body copy.</div>
</body></html>
