<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--tpt-cream); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pill { display: inline-block; padding: 5px 11px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; }
  .pill.coming { background: #ECE4D2; color: #5C5A53; }
  .pill.open { background: #C97B27; color: #FBF8F1; }
  .pill.free { background: #1F3F2E; color: #FBF8F1; }
  .meta { font-size: 11px; color: #5C5A53; margin-top: 16px; }
</style></head><body>
<div class="row">
  <span class="pill free">FREE</span>
  <span class="pill open">APPLY FOR EARLY ACCESS</span>
  <span class="pill coming">COMING SOON</span>
  <span class="pill coming">AFTER LAUNCH</span>
</div>
<div class="meta">Status badges — 4px radius, 0.08em tracking, uppercase. Three states only.</div>
</body></html>
