<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-label="The Primary Trail mark" role="img">
  <!-- Back peak (taller, left-leaning) -->
  <path d="M58 24 L116 174 L0 174 Z" fill="#1F3F2E"/>
  <!-- Front peak (shorter, right-leaning, overlapping) -->
  <path d="M132 58 L200 174 L52 174 Z" fill="#1F3F2E"/>
  <!-- Amber S-curve trail through the front peak -->
  <path d="M92 174 C82 152, 112 138, 100 116 C88 94, 118 80, 134 56"
        stroke="#C97B27" stroke-width="18" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
